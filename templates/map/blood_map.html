<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Map — BloodChain</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Leaflet CSS CDN (MUST be before map.css) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    
    <!-- Map CSS -->
    <link rel="stylesheet" href="../../static/css/map.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar-blood navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-droplet-fill" style="color: #dc3545;"></i>
                <span class="ms-2">BloodChain</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Map</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Alerts</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="container-fluid">
            <div class="row g-2 align-items-center">
                <div class="col-auto">
                    <label class="filter-label">Blood Type</label>
                    <select name="blood_type" class="form-select form-select-sm">
                        <option value="">All Types</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="filter-label">Radius</label>
                    <select name="radius" class="form-select form-select-sm">
                        <option>5 km</option>
                        <option>10 km</option>
                        <option selected>25 km</option>
                        <option>50 km</option>
                    </select>
                </div>
                <div class="col-auto">
                    <label class="filter-label">Status</label>
                    <select name="status" class="form-select form-select-sm">
                        <option value="">All</option>
                        <option>Available</option>
                        <option>Low</option>
                        <option>Critical</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button class="btn btn-danger btn-sm px-4">
                        <i class="bi bi-search me-1"></i>Search
                    </button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-secondary btn-sm px-3">
                        <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="blood-map" class="blood-map-container"></div>

    <!-- Summary Cards -->
    <div class="container py-4">
        <div class="row g-3 justify-content-center">
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-card-value">5</div>
                    <div class="summary-card-label">
                        <i class="bi bi-hospital-fill me-1"></i>
                        Hospitals Shown
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-card-value">45</div>
                    <div class="summary-card-label">
                        <i class="bi bi-droplet-fill me-1"></i>
                        Total Units Available
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card critical">
                    <div class="summary-card-value text-danger">1</div>
                    <div class="summary-card-label">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        Critical Alerts
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-dark text-center py-4 mt-5">
        <p class="text-muted mb-0">© 2025 BloodChain. Saving lives through technology.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../static/js/map.js"></script>
</body>
</html>
