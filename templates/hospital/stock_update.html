<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Blood Stock — BloodChain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/hospital.css">
    <style>
        #toast { position:fixed;top:20px;right:20px;z-index:9999;padding:14px 24px;border-radius:8px;color:white;font-weight:500;display:none;}
        .update-form { max-width:600px;margin:0 auto; }
        .form-card { background:var(--white);border-radius:12px;overflow:hidden;border:1px solid var(--border); }
        .form-card-header { background:linear-gradient(135deg,var(--red) 0%,#a01818 100%);padding:28px;color:var(--white); }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block;font-size:13px;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px; }
        .form-group select, .form-group input { width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:14px; }
    </style>
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar">
            <div class="sidebar-logo"><div class="blood-drop-icon"></div><span>BloodChain</span></div>
            <nav class="sidebar-nav">
                <a href="/hospital/dashboard/" class="nav-link"><i class="bi bi-house-fill"></i><span>Dashboard</span></a>
                <a href="/hospital/stock/" class="nav-link active"><i class="bi bi-capsule"></i><span>Blood Stock</span></a>
                <a href="/hospital/requests/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Request Blood</span></a>
                <a href="/hospital/donors/" class="nav-link"><i class="bi bi-people-fill"></i><span>Donors Nearby</span></a>
                <a href="/hospital/notifications/" class="nav-link"><i class="bi bi-bell-fill"></i><span>Notifications</span><span class="nav-badge" id="nav-badge"></span></a>
                <a href="/hospital/alerts/create/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Emergency Alerts</span></a>
                <a href="/hospital/profile/" class="nav-link"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><p>Hospital</p><a href="#" class="logout-link" id="logout-link">Logout</a></div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><h1 class="topbar-title">Update Blood Stock</h1></div>
                <div class="topbar-right">
                    <span class="topbar-date" id="current-date"></span>
                    <div class="topbar-notification"><i class="bi bi-bell-fill"></i><span class="notification-badge" id="topbar-badge"></span></div>
                    <div class="topbar-avatar" id="avatar">H</div>
                </div>
            </header>
            <div class="page-body">
                <div class="update-form">
                    <div class="form-card">
                        <div class="form-card-header"><h2 style="margin:0;">Stock Update</h2><p style="margin:8px 0 0;opacity:0.95;">Update blood inventory levels</p></div>
                        <div style="padding:32px;">
                            <form id="stock-form">
                                <div class="form-group">
                                    <label>Hospital ID</label>
                                    <input type="number" id="hospital_id" value="1" required style="width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:14px;">
                                </div>
                                <div class="form-group">
                                    <label>Blood Type</label>
                                    <select id="blood_type" required style="width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:white;">
                                        <option value="">Select...</option>
                                        <option value="A+">A+</option><option value="A-">A-</option>
                                        <option value="B+">B+</option><option value="B-">B-</option>
                                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                                        <option value="O+">O+</option><option value="O-">O-</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Units Available (Liters)</label>
                                    <input type="number" id="units_available" min="0" step="0.1" required style="width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:14px;">
                                </div>
                                <div style="display:flex;gap:12px;">
                                    <a href="/hospital/stock/" style="flex:1;padding:12px;background:var(--border);color:var(--text);border-radius:8px;text-align:center;text-decoration:none;font-weight:600;">Cancel</a>
                                    <button type="submit" style="flex:1;padding:12px;background:var(--red);color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Update Stock</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="toast"></div>
    <script>
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.style.background = type === 'error' ? '#d32f2f' : '#2e7d32';
            t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000);
        }
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault(); localStorage.removeItem('token'); localStorage.removeItem('hospital_email');
            window.location.replace('/login/');
        });

        document.getElementById('stock-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const hospital_id = document.getElementById('hospital_id').value;
            const data = {
                blood_type: document.getElementById('blood_type').value,
                units_available: parseFloat(document.getElementById('units_available').value)
            };
            if (!data.blood_type) { showToast('Select blood type', 'error'); return; }
            try {
                const res = await fetch(`/api/hospital/stock/${hospital_id}/update/`, {
                    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('Failed');
                showToast('Stock updated successfully!', 'success');
                this.reset();
            } catch(e) { showToast('Error: ' + e.message, 'error'); }
        });
    </script>
</body>
</html>
