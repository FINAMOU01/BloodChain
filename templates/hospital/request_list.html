<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Requests — BloodChain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/hospital.css">
    <style>
        .request-controls { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box input { width: 100%; padding: 12px 16px 12px 40px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .filter-select { padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--white); color: var(--text); }
        .request-list { background: var(--white); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .request-item { display: grid; grid-template-columns: 60px 1fr 120px 100px 80px 80px; gap: 16px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .request-item:last-child { border-bottom: none; }
        .request-id { font-weight: 600; color: var(--red); font-size: 13px; }
        .request-patient { color: var(--text); font-weight: 500; font-size: 14px; }
        .request-blood-type { display: inline-block; padding: 6px 12px; background: var(--red-light); color: var(--red); border-radius: 6px; font-weight: 600; font-size: 12px; }
        .request-status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .request-status.pending { background: var(--orange-light); color: var(--orange); }
        .request-status.fulfilled { background: var(--green-light); color: var(--green); }
        .request-status.cancelled { background: var(--red-light); color: var(--red); }
        .request-date { color: var(--muted); font-size: 13px; }
        .btn-icon { width: 32px; height: 32px; border: none; border-radius: 6px; background: var(--border); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .btn-icon:hover { background: var(--red); color: var(--white); }
    </style>
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar">
            <div class="sidebar-logo"><div class="blood-drop-icon"></div><span>BloodChain</span></div>
            <nav class="sidebar-nav">
                <a href="/hospital/dashboard/" class="nav-link"><i class="bi bi-house-fill"></i><span>Dashboard</span></a>
                <a href="/hospital/stock/" class="nav-link"><i class="bi bi-capsule"></i><span>Blood Stock</span></a>
                <a href="/hospital/requests/" class="nav-link active"><i class="bi bi-exclamation-triangle-fill"></i><span>Request Blood</span></a>
                <a href="/hospital/donors/" class="nav-link"><i class="bi bi-people-fill"></i><span>Donors Nearby</span></a>
                <a href="/hospital/notifications/" class="nav-link"><i class="bi bi-bell-fill"></i><span>Notifications</span><span class="nav-badge" id="nav-badge"></span></a>
                <a href="/hospital/alerts/create/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Emergency Alerts</span></a>
                <a href="/hospital/profile/" class="nav-link"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><p>Hospital</p><a href="#" class="logout-link" id="logout-link">Logout</a></div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><h1 class="topbar-title">Blood Requests</h1></div>
                <div class="topbar-right">
                    <span class="topbar-date" id="current-date"></span>
                    <div class="topbar-notification"><i class="bi bi-bell-fill"></i><span class="notification-badge" id="topbar-badge"></span></div>
                    <div class="topbar-avatar" id="avatar">H</div>
                </div>
            </header>
            <div class="page-body">
                <div class="request-controls">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="search-input" placeholder="Search by request ID or blood type..." oninput="filterRequests()">
                    </div>
                    <select class="filter-select" id="status-filter" onchange="filterRequests()">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="fulfilled">Fulfilled</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <a href="/hospital/request/new/" style="display:flex;align-items:center;gap:8px;padding:12px 24px;text-decoration:none;color:white;border-radius:8px;background:var(--red);font-weight:600;">
                        <i class="bi bi-plus-circle-fill"></i> New Request
                    </a>
                </div>
                <div class="request-list" id="request-list"><p style="padding:20px;color:var(--muted);">Loading...</p></div>
            </div>
        </main>
    </div>
    <script>
        const storedUser = JSON.parse(localStorage.getItem('user') || 'null');
        const HOSPITAL_EMAIL = localStorage.getItem('hospital_email') || storedUser?.email;
        let allRequests = [];

        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token'); localStorage.removeItem('hospital_email');
            window.location.replace('/login/');
        });

        function timeAgo(d) { const n=new Date(),t=new Date(d),m=Math.floor((n-t)/60000); if(m<60)return m+'m ago'; const h=Math.floor(m/60);return h<24?h+'h ago':Math.floor(h/24)+'d ago'; }

        async function loadRequests() {
            try {
                const [res, notifsRes] = await Promise.all([
                    fetch('/api/hospital/requests/'),
                    fetch('/api/notifications/list/')
                ]);
                const notifs = notifsRes.ok ? await notifsRes.json() : [];
                document.getElementById('nav-badge').textContent = notifs.filter(n=>!n.is_sent).length || '';
                document.getElementById('topbar-badge').textContent = notifs.filter(n=>!n.is_sent).length || '';
                if (!res.ok) throw new Error('Failed');
                allRequests = await res.json();
                renderRequests(allRequests);
            } catch(e) {
                document.getElementById('request-list').innerHTML = '<p style="padding:20px;color:var(--muted);">Failed to load requests.</p>';
            }
        }

        function renderRequests(requests) {
            const list = document.getElementById('request-list');
            if (requests.length === 0) {
                list.innerHTML = '<p style="padding:20px;color:var(--muted);text-align:center;">No blood requests found.</p>';
                return;
            }
            list.innerHTML = requests.map(r => `
                <div class="request-item" style="cursor:pointer;" onclick="window.location='/hospital/request/detail/?id=${r.id}'">
                    <div class="request-id">#${r.id}</div>
                    <div class="request-patient">${r.hospital_name || 'Hospital #' + r.hospital}</div>
                    <div><span class="request-blood-type">${r.blood_type}</span></div>
                    <div class="request-date">${r.units_needed} Units</div>
                    <div><span class="request-status ${r.status}">${r.status}</span></div>
                    <div class="request-date">${r.requested_at ? timeAgo(r.requested_at) : '-'}</div>
                </div>
            `).join('');
        }

        function filterRequests() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('status-filter').value;
            let filtered = allRequests;
            if (query) filtered = filtered.filter(r => (''+r.id).includes(query) || (r.blood_type||'').toLowerCase().includes(query));
            if (status) filtered = filtered.filter(r => r.status === status);
            renderRequests(filtered);
        }

        document.addEventListener('DOMContentLoaded', loadRequests);
    </script>
</body>
</html>
