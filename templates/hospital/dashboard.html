<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dashboard — BloodChain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/hospital.css">
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar">
            <div class="sidebar-logo"><div class="blood-drop-icon"></div><span>BloodChain</span></div>
            <nav class="sidebar-nav">
                <a href="/hospital/dashboard/" class="nav-link active"><i class="bi bi-house-fill"></i><span>Dashboard</span></a>
                <a href="/hospital/stock/" class="nav-link"><i class="bi bi-capsule"></i><span>Blood Stock</span></a>
                <a href="/hospital/request/new/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Request Blood</span></a>
                <a href="/hospital/donors/" class="nav-link"><i class="bi bi-people-fill"></i><span>Donors Nearby</span></a>
                <a href="/hospital/notifications/" class="nav-link"><i class="bi bi-bell-fill"></i><span>Notifications</span><span class="nav-badge" id="nav-badge"></span></a>
                <a href="/hospital/alerts/create/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Emergency Alerts</span></a>
                <a href="/hospital/profile/" class="nav-link"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><p id="sidebar-name">Hospital</p><a href="#" class="logout-link" id="logout-link">Logout</a></div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><h1 class="topbar-title">Dashboard</h1></div>
                <div class="topbar-right">
                    <span class="topbar-date" id="current-date"></span>
                    <div class="topbar-notification"><i class="bi bi-bell-fill"></i><span class="notification-badge" id="topbar-badge"></span></div>
                    <div class="topbar-avatar" id="avatar">H</div>
                </div>
            </header>
            <div class="page-body">
                <div class="stats-grid">
                    <div class="stat-card" style="border-left-color: var(--red);"><div class="stat-label">Total Requests</div><div class="stat-value" id="stat-total">0</div><div class="stat-small">All time</div></div>
                    <div class="stat-card" style="border-left-color: var(--green);"><div class="stat-label">Fulfilled</div><div class="stat-value" id="stat-fulfilled">0</div><div class="stat-small">Completed requests</div></div>
                    <div class="stat-card" style="border-left-color: var(--orange);"><div class="stat-label">Pending</div><div class="stat-value" id="stat-pending">0</div><div class="stat-small">Awaiting response</div></div>
                    <div class="stat-card" style="border-left-color: var(--red);"><div class="stat-label">Stock Types</div><div class="stat-value" id="stat-stock-types">0</div><div class="stat-small" id="stat-stock-low">Monitoring...</div></div>
                </div>
                <div class="recent-requests-container">
                    <div class="panel recent-requests-panel">
                        <div class="panel-header"><h2 class="panel-title">Recent Requests</h2><a href="/hospital/requests/" class="panel-link">View all</a></div>
                        <div class="panel-divider"></div>
                        <div class="requests-list" id="requests-list"><p style="color: var(--muted); padding: 20px;">Loading requests...</p></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        const storedUser = JSON.parse(localStorage.getItem('user') || 'null');
        const HOSPITAL_EMAIL = localStorage.getItem('hospital_email') || storedUser?.email;
        if (!localStorage.getItem('token') || !HOSPITAL_EMAIL) { window.location.replace('/login/'); }

        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token'); localStorage.removeItem('user');
            localStorage.removeItem('donor_email'); localStorage.removeItem('hospital_email');
            window.location.replace('/login/');
        });

        async function loadDashboard() {
            document.getElementById('sidebar-name').textContent = HOSPITAL_EMAIL;
            document.getElementById('avatar').textContent = HOSPITAL_EMAIL.charAt(0).toUpperCase();
            try {
                const [reqRes, notifRes, stockRes] = await Promise.all([
                    fetch('/api/hospital/requests/'), fetch('/api/notifications/list/'), fetch('/api/hospital/stock/1/')
                ]);
                const requests = reqRes.ok ? await reqRes.json() : [];
                const notifs = notifRes.ok ? await notifRes.json() : [];
                const stock = stockRes.ok ? await stockRes.json() : [];
                const total = requests.length, fulfilled = requests.filter(r=>r.status==='fulfilled').length, pending = requests.filter(r=>r.status==='pending').length;
                const notifCount = notifs.filter(n=>!n.is_sent).length;
                document.getElementById('stat-total').textContent = total;
                document.getElementById('stat-fulfilled').textContent = fulfilled;
                document.getElementById('stat-pending').textContent = pending;
                document.getElementById('stat-stock-types').textContent = stock.length||'0';
                document.getElementById('stat-stock-low').textContent = stock.filter(s=>s.units_available<5).length+' types low';
                document.getElementById('nav-badge').textContent = notifCount||''; document.getElementById('topbar-badge').textContent = notifCount||'';
                const listEl = document.getElementById('requests-list');
                if (requests.length===0) { listEl.innerHTML = '<p style="color:var(--muted);padding:20px;">No requests yet</p>'; return; }
                const recent = requests.slice(-5).reverse();
                listEl.innerHTML = recent.map(r => `<div class="request-item" style="cursor:pointer;" onclick="window.location='/hospital/request/detail/?id=${r.id}'"><div class="request-blood-badge">${r.blood_type}</div><div class="request-info"><div class="request-name">#${r.id}</div><div class="request-time">${new Date(r.requested_at).toLocaleDateString()}</div></div><span class="urgency-badge">${r.status}</span></div>`).join('');
            } catch(e) { console.error(e); }
        }
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
