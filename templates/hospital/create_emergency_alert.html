<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Emergency Alert — BloodChain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/hospital.css">
    <style>
        #toast { position:fixed;top:20px;right:20px;z-index:9999;padding:14px 24px;border-radius:8px;color:white;font-weight:500;display:none;}
        .form-container { max-width:600px;margin:0 auto; }
        .form-card { background:var(--white);border-radius:12px;overflow:hidden;border:1px solid var(--border); }
        .form-card-header { background:linear-gradient(135deg,var(--red) 0%,#a01818 100%);padding:28px;color:var(--white); }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block;font-size:13px;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px; }
        .form-group input, .form-group select, .form-group textarea { width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif; }
        .form-group textarea { min-height:100px;resize:vertical; }
        .blood-type-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:12px; }
        .blood-type-option input[type="radio"] { display:none; }
        .blood-type-option input[type="radio"] + label { display:flex;align-items:center;justify-content:center;padding:12px;border:2px solid var(--border);border-radius:8px;cursor:pointer;font-weight:600;transition:all 0.3s; }
        .blood-type-option input[type="radio"]:checked + label { background:var(--red);color:white;border-color:var(--red); }
    </style>
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar">
            <div class="sidebar-logo"><div class="blood-drop-icon"></div><span>BloodChain</span></div>
            <nav class="sidebar-nav">
                <a href="/hospital/dashboard/" class="nav-link"><i class="bi bi-house-fill"></i><span>Dashboard</span></a>
                <a href="/hospital/stock/" class="nav-link"><i class="bi bi-capsule"></i><span>Blood Stock</span></a>
                <a href="/hospital/request/new/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Request Blood</span></a>
                <a href="/hospital/donors/" class="nav-link"><i class="bi bi-people-fill"></i><span>Donors Nearby</span></a>
                <a href="/hospital/notifications/" class="nav-link"><i class="bi bi-bell-fill"></i><span>Notifications</span><span class="nav-badge" id="nav-badge"></span></a>
                <a href="/hospital/alerts/create/" class="nav-link active"><i class="bi bi-exclamation-triangle-fill"></i><span>Emergency Alerts</span></a>
                <a href="/hospital/profile/" class="nav-link"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><p>Hospital</p><a href="#" class="logout-link" id="logout-link">Logout</a></div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><h1 class="topbar-title">Create Emergency Alert</h1></div>
                <div class="topbar-right">
                    <span class="topbar-date" id="current-date"></span>
                    <div class="topbar-notification"><i class="bi bi-bell-fill"></i><span class="notification-badge" id="topbar-badge"></span></div>
                    <div class="topbar-avatar" id="avatar">H</div>
                </div>
            </header>
            <div class="page-body">
                <div class="form-container">
                    <div class="form-card">
                        <div class="form-card-header">
                            <h2 style="margin:0;"><i class="bi bi-exclamation-triangle-fill"></i> Emergency Alert</h2>
                            <p style="margin:8px 0 0;opacity:0.95;">Send an urgent alert to donors</p>
                        </div>
                        <div style="padding:32px;">
                            <form id="alert-form">
                                <div class="form-group">
                                    <label>Recipient Email (or leave empty for all donors)</label>
                                    <input type="email" id="recipient_email" placeholder="donor@example.com">
                                </div>
                                <div class="form-group">
                                    <label>Blood Type Needed</label>
                                    <div class="blood-type-grid">
                                        <div class="blood-type-option"><input type="radio" name="blood_type_needed" id="bt_O+" value="O+" required><label for="bt_O+">O+</label></div>
                                        <div class="blood-type-option"><input type="radio" name="blood_type_needed" id="bt_O-" value="O-"><label for="bt_O-">O-</label></div>
                                        <div class="blood-type-option"><input type="radio" name="blood_type_needed" id="bt_A+" value="A+"><label for="bt_A+">A+</label></div>
                                        <div class="blood-type-option"><input type="radio" name="blood_type_needed" id="bt_A-" value="A-"><label for="bt_A-">A-</label></div>
                                        <div class="blood-type-option"><input type="radio" name="blood_type_needed" id="bt_B+" value="B+"><label for="bt_B+">B+</label></div>
                                        <div class="blood-type-option"><input type="radio" name="blood_type_needed" id="bt_B-" value="B-"><label for="bt_B-">B-</label></div>
                                        <div class="blood-type-option"><input type="radio" name="blood_type_needed" id="bt_AB+" value="AB+"><label for="bt_AB+">AB+</label></div>
                                        <div class="blood-type-option"><input type="radio" name="blood_type_needed" id="bt_AB-" value="AB-"><label for="bt_AB-">AB-</label></div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Hospital Name</label>
                                    <input type="text" id="hospital_name" placeholder="Your hospital name" required>
                                </div>
                                <div class="form-group">
                                    <label>Message</label>
                                    <textarea id="message" placeholder="Describe the emergency situation..." required></textarea>
                                </div>
                                <div style="display:flex;gap:12px;">
                                    <a href="/hospital/dashboard/" style="flex:1;padding:12px;background:var(--border);color:var(--text);border-radius:8px;text-align:center;text-decoration:none;font-weight:600;">Cancel</a>
                                    <button type="submit" style="flex:1;padding:12px;background:var(--red);color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;"><i class="bi bi-exclamation-triangle-fill"></i> Send Alert</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="toast"></div>
    <script>
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.style.background = type === 'error' ? '#d32f2f' : '#2e7d32';
            t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000);
        }
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault(); localStorage.removeItem('token'); localStorage.removeItem('hospital_email');
            window.location.replace('/login/');
        });

        document.getElementById('alert-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                recipient_email: document.getElementById('recipient_email').value || 'all',
                blood_type_needed: document.querySelector('input[name="blood_type_needed"]:checked')?.value,
                hospital_name: document.getElementById('hospital_name').value,
                message: document.getElementById('message').value,
                is_emergency: true
            };
            if (!data.blood_type_needed) { showToast('Please select a blood type', 'error'); return; }
            try {
                const res = await fetch('/api/notifications/alert/', {
                    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
                });
                if (!res.ok) { const err = await res.json(); throw new Error(Object.values(err).flat().join(', ')); }
                showToast('Emergency alert sent to donors!', 'success');
                this.reset();
            } catch(e) { showToast('Error: ' + e.message, 'error'); }
        });
    </script>
</body>
</html>
