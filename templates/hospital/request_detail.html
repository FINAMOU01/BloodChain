<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Details — BloodChain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/hospital.css">
    <style>
        #toast { position:fixed;top:20px;right:20px;z-index:9999;padding:14px 24px;border-radius:8px;color:white;font-weight:500;display:none;}
        .detail-container { max-width:800px;margin:0 auto; }
        .detail-header { background:linear-gradient(135deg,var(--red) 0%,#a01818 100%);color:var(--white);padding:28px;border-radius:12px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center; }
        .detail-card { background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px; }
        .detail-row { display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border); }
        .detail-label { font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase; }
        .detail-value { font-size:14px;font-weight:500;color:var(--text); }
        .btn { padding:12px 28px;border:none;border-radius:8px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;text-decoration:none; }
        .btn-primary { background:var(--red);color:var(--white); }
        .btn-secondary { background:var(--border);color:var(--text); }
        .btn-success { background:var(--green);color:var(--white); }
    </style>
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar">
            <div class="sidebar-logo"><div class="blood-drop-icon"></div><span>BloodChain</span></div>
            <nav class="sidebar-nav">
                <a href="/hospital/dashboard/" class="nav-link"><i class="bi bi-house-fill"></i><span>Dashboard</span></a>
                <a href="/hospital/stock/" class="nav-link"><i class="bi bi-capsule"></i><span>Blood Stock</span></a>
                <a href="/hospital/requests/" class="nav-link active"><i class="bi bi-exclamation-triangle-fill"></i><span>Request Blood</span></a>
                <a href="/hospital/donors/" class="nav-link"><i class="bi bi-people-fill"></i><span>Donors Nearby</span></a>
                <a href="/hospital/notifications/" class="nav-link"><i class="bi bi-bell-fill"></i><span>Notifications</span><span class="nav-badge" id="nav-badge"></span></a>
                <a href="/hospital/alerts/create/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Emergency Alerts</span></a>
                <a href="/hospital/profile/" class="nav-link"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><p>Hospital</p><a href="#" class="logout-link" id="logout-link">Logout</a></div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><h1 class="topbar-title">Request Details</h1></div>
                <div class="topbar-right">
                    <span class="topbar-date" id="current-date"></span>
                    <div class="topbar-notification"><i class="bi bi-bell-fill"></i><span class="notification-badge" id="topbar-badge"></span></div>
                    <div class="topbar-avatar" id="avatar">H</div>
                </div>
            </header>
            <div class="page-body">
                <div class="detail-container" id="detail-container"><p style="color:var(--muted);">Loading...</p></div>
            </div>
        </main>
    </div>
    <div id="toast"></div>
    <script>
        const storedUser = JSON.parse(localStorage.getItem('user') || 'null');
        const HOSPITAL_EMAIL = localStorage.getItem('hospital_email') || storedUser?.email;
        const params = new URLSearchParams(window.location.search);
        const REQUEST_ID = params.get('id');

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.background = type === 'error' ? '#d32f2f' : '#2e7d32';
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token'); localStorage.removeItem('hospital_email');
            window.location.replace('/login/');
        });

        async function loadDetail() {
            if (!REQUEST_ID) {
                document.getElementById('detail-container').innerHTML = '<p>No request ID specified.</p>';
                return;
            }
            try {
                const [res, notifsRes] = await Promise.all([
                    fetch(`/api/hospital/requests/${REQUEST_ID}/`),
                    fetch('/api/notifications/list/')
                ]);
                const notifs = notifsRes.ok ? await notifsRes.json() : [];
                const notifCount = notifs.filter(n=>!n.is_sent).length;
                document.getElementById('nav-badge').textContent = notifCount || '';
                document.getElementById('topbar-badge').textContent = notifCount || '';

                if (!res.ok) throw new Error('Not found');
                const r = await res.json();
                renderDetail(r);
            } catch(e) {
                document.getElementById('detail-container').innerHTML = '<p style="color:var(--muted);">Request not found.</p>';
            }
        }

        function renderDetail(r) {
            const container = document.getElementById('detail-container');
            container.innerHTML = `
                <div class="detail-header">
                    <div>
                        <h2 style="margin:0 0 8px 0;">Request #${r.id}</h2>
                        <p style="margin:0;opacity:0.95;">Blood Type: ${r.blood_type} | ${r.units_needed} Units</p>
                    </div>
                    <span style="padding:8px 16px;background:rgba(255,255,255,0.2);border-radius:6px;font-weight:600;">${r.status}</span>
                </div>
                <div class="detail-card">
                    <div class="detail-row">
                        <span class="detail-label">Blood Type</span>
                        <span class="detail-value">${r.blood_type}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Units Required</span>
                        <span class="detail-value">${r.units_needed}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value" style="font-weight:600;color:${r.status === 'pending' ? 'var(--orange)' : r.status === 'fulfilled' ? 'var(--green)' : 'var(--red)'};">${r.status}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Hospital ID</span>
                        <span class="detail-value">${r.hospital}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Requested At</span>
                        <span class="detail-value">${r.requested_at ? new Date(r.requested_at).toLocaleString() : '-'}</span>
                    </div>
                </div>
                <div style="display:flex;gap:12px;justify-content:flex-end;">
                    <a href="/hospital/requests/" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
                    ${r.status === 'pending' ? `
                        <button class="btn btn-success" onclick="updateStatus(${r.id}, 'fulfilled')"><i class="bi bi-check-circle-fill"></i> Mark Fulfilled</button>
                        <button class="btn btn-primary" onclick="updateStatus(${r.id}, 'cancelled')"><i class="bi bi-x-circle-fill"></i> Cancel</button>
                    ` : ''}
                </div>
            `;
        }

        async function updateStatus(id, status) {
            try {
                const res = await fetch(`/api/hospital/requests/${id}/update/`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                if (!res.ok) throw new Error('Failed');
                showToast('Request updated to ' + status, 'success');
                loadDetail();
            } catch(e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadDetail);
    </script>
</body>
</html>
