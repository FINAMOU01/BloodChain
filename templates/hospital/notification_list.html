<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — BloodChain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/hospital.css">
    <style>
        .notification-stats { display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px; }
        .stat-card { background:var(--white);border:1px solid var(--border);border-radius:8px;padding:24px;text-align:center; }
        .stat-number { font-family:'Playfair Display',serif;font-size:2.5rem;color:var(--red);margin:0;font-weight:700; }
        .stat-label { color:var(--muted);font-size:0.9rem;margin:8px 0 0; }
        .notification-container { display:flex;flex-direction:column;gap:12px; }
        .notification-card { background:var(--white);border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;gap:16px;align-items:flex-start; }
        .notification-icon { width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0; }
        .notification-icon.emergency { background:rgba(185,28,28,0.1);color:var(--red); }
        .notification-icon.info { background:rgba(59,130,246,0.1);color:#3B82F6; }
        .notification-content { flex:1; }
        .notification-message { font-size:0.95rem;color:var(--text);margin:0 0 6px; }
        .notification-meta { font-size:0.8rem;color:var(--muted);display:flex;gap:12px; }
    </style>
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar">
            <div class="sidebar-logo"><div class="blood-drop-icon"></div><span>BloodChain</span></div>
            <nav class="sidebar-nav">
                <a href="/hospital/dashboard/" class="nav-link"><i class="bi bi-house-fill"></i><span>Dashboard</span></a>
                <a href="/hospital/stock/" class="nav-link"><i class="bi bi-capsule"></i><span>Blood Stock</span></a>
                <a href="/hospital/requests/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Request Blood</span></a>
                <a href="/hospital/donors/" class="nav-link"><i class="bi bi-people-fill"></i><span>Donors Nearby</span></a>
                <a href="/hospital/notifications/" class="nav-link active"><i class="bi bi-bell-fill"></i><span>Notifications</span><span class="nav-badge" id="nav-badge"></span></a>
                <a href="/hospital/alerts/create/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Emergency Alerts</span></a>
                <a href="/hospital/profile/" class="nav-link"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer"><p>Hospital</p><a href="#" class="logout-link" id="logout-link">Logout</a></div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><h1 class="topbar-title">Notifications</h1></div>
                <div class="topbar-right">
                    <span class="topbar-date" id="current-date"></span>
                    <div class="topbar-avatar" id="avatar">H</div>
                </div>
            </header>
            <div class="page-body">
                <div class="notification-stats" id="stats-row">
                    <div class="stat-card"><p class="stat-number" id="stat-total">0</p><p class="stat-label">Total</p></div>
                    <div class="stat-card"><p class="stat-number" id="stat-emergency">0</p><p class="stat-label">Emergency</p></div>
                    <div class="stat-card"><p class="stat-number" id="stat-unread">0</p><p class="stat-label">Unread</p></div>
                </div>
                <div class="notification-container" id="notif-container">
                    <p style="color:var(--muted);padding:20px;">Loading...</p>
                </div>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault(); localStorage.removeItem('token'); localStorage.removeItem('hospital_email');
            window.location.replace('/login/');
        });

        async function loadNotifications() {
            try {
                const res = await fetch('/api/notifications/list/');
                if (!res.ok) throw new Error('Failed');
                const notifs = await res.json();

                document.getElementById('stat-total').textContent = notifs.length;
                document.getElementById('stat-emergency').textContent = notifs.filter(n => n.is_emergency).length;
                document.getElementById('stat-unread').textContent = notifs.filter(n => !n.is_sent).length;
                document.getElementById('nav-badge').textContent = notifs.filter(n=>!n.is_sent).length || '';

                const container = document.getElementById('notif-container');
                if (notifs.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);"><i class="bi bi-bell-slash" style="font-size:48px;display:block;margin-bottom:16px;"></i>No notifications yet</div>';
                    return;
                }
                container.innerHTML = notifs.map(n => `
                    <div class="notification-card">
                        <div class="notification-icon ${n.is_emergency ? 'emergency' : 'info'}">
                            <i class="bi ${n.is_emergency ? 'bi-exclamation-triangle-fill' : 'bi-info-circle-fill'}"></i>
                        </div>
                        <div class="notification-content">
                            <p class="notification-message">${n.message || 'No message'}</p>
                            <div class="notification-meta">
                                <span>Blood: ${n.blood_type_needed || 'N/A'}</span>
                                <span>${n.hospital_name || ''}</span>
                                <span>${n.created_at ? new Date(n.created_at).toLocaleString() : ''}</span>
                                ${!n.is_sent ? '<span style="color:var(--red);font-weight:600;">New</span>' : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('notif-container').innerHTML = '<p style="color:var(--muted);">Could not load notifications.</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadNotifications);
    </script>
</body>
</html>
