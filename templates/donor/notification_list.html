<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - BloodChain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/donor.css">
    <style>
        .notification-container { display: flex; flex-direction: column; gap: 1rem; }
        .notification-card { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; display: flex; gap: 1.5rem; align-items: flex-start; transition: all 0.3s; cursor: pointer; position: relative; }
        .notification-card:hover { border-color: var(--red); box-shadow: 0 4px 12px rgba(185,28,28,0.1); }
        .notification-card.unread { background: var(--red-light); border-color: var(--red); }
        .notification-card.unread::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--red); border-radius: 8px 0 0 8px; }
        .notification-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .notification-icon.emergency { background: rgba(185,28,28,0.1); color: var(--red); }
        .notification-icon.appointment { background: rgba(16,163,74,0.1); color: #16A34A; }
        .notification-icon.reward { background: rgba(234,88,12,0.1); color: var(--orange); }
        .notification-content { flex: 1; min-width: 0; }
        .notification-title-text { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text); margin: 0 0 0.5rem 0; font-weight: 700; }
        .notification-message { font-size: 0.95rem; color: var(--text); margin: 0 0 0.75rem 0; line-height: 1.5; }
        .notification-meta { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
        .notification-time { display: flex; align-items: center; gap: 0.3rem; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
        .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    </style>
</head>
<body>
<div class="d-flex">
    <aside class="sidebar">
        <div class="sidebar-logo"><div class="blood-drop-icon"></div><span>BloodChain</span></div>
        <nav class="sidebar-nav">
            <a href="/donor/dashboard/" class="nav-link"><i class="bi bi-house-fill"></i><span>Dashboard</span></a>
            <a href="/donor/history/" class="nav-link"><i class="bi bi-heart-pulse"></i><span>My Donations</span></a>
            <a href="/donor/hospitals/" class="nav-link"><i class="bi bi-hospital"></i><span>Nearby Hospitals</span></a>
            <a href="/donor/appointments/" class="nav-link"><i class="bi bi-calendar-check"></i><span>Appointments</span></a>
            <a href="/donor/eligibility/" class="nav-link"><i class="bi bi-shield-check"></i><span>My Eligibility</span></a>
            <a href="/donor/rewards/" class="nav-link"><i class="bi bi-gift"></i><span>Rewards & Points</span></a>
            <a href="/donor/alerts/" class="nav-link"><i class="bi bi-exclamation-triangle-fill"></i><span>Emergency Alerts</span></a>
            <a href="/donor/notifications/" class="nav-link active"><i class="bi bi-bell-fill"></i><span>Notifications</span><span class="nav-badge" id="nav-badge">0</span></a>
            <a href="/donor/profile/" class="nav-link"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer"><p>Donor</p><a href="/login/" class="logout-link">Logout</a></div>
    </aside>
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left"><h1 class="topbar-title">Notifications</h1><span class="topbar-date" id="current-date"></span></div>
            <div class="topbar-right"><i class="bi bi-bell-fill" style="font-size:1.5rem;color:var(--red);"></i></div>
        </header>
        <div class="page-body">
            <div class="notification-container" id="notifications-container">
                <div class="empty-state"><div class="empty-state-icon"><i class="bi bi-inbox"></i></div><p>No notifications found</p></div>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/donor-auth.js"></script>
<script>
const DONOR_EMAIL = window.BloodChainDonor.requireAuth();
window.BloodChainDonor.setupShell();

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[char]));
}

function loadNotifications() {
    fetch('/api/notifications/list/')
        .then(r=>r.json())
        .then(data => {
            const filtered = data.filter(n => n.recipient_email === DONOR_EMAIL || !n.recipient_email);
            const container = document.getElementById('notifications-container');
            document.getElementById('nav-badge').textContent = filtered.filter(n=>!n.is_sent).length;

            if (!filtered.length) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="bi bi-inbox"></i></div><p>No notifications found</p></div>';
                return;
            }
            container.innerHTML = filtered.map(n => `
                <div class="notification-card ${n.is_emergency ? 'unread' : ''}">
                    <div class="notification-icon ${n.is_emergency ? 'emergency' : 'appointment'}">
                        <i class="bi ${n.is_emergency ? 'bi-exclamation-triangle-fill' : 'bi-bell-fill'}"></i>
                    </div>
                    <div class="notification-content">
                        <p class="notification-title-text">${escapeHtml(n.hospital_name || 'BloodChain')} - ${escapeHtml(n.blood_type_needed || '')}</p>
                        <p class="notification-message">${escapeHtml(n.message)}</p>
                        <div class="notification-meta">
                            <div class="notification-time"><i class="bi bi-clock"></i> ${new Date(n.created_at).toLocaleDateString()}</div>
                            ${n.is_emergency ? '<span class="badge" style="background:var(--red);color:white;padding:2px 8px;border-radius:4px;font-size:0.75rem;">EMERGENCY</span>' : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        })
        .catch(err => console.error('Failed to load notifications', err));
}
document.addEventListener('DOMContentLoaded', loadNotifications);
</script>
</body>
</html>
