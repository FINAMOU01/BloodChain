<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - BloodChain</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --red: #B91C1C;
            --red-dark: #7F1D1D;
            --red-light: #FEE2E2;
            --cream: #FDF6EC;
            --text: #2C1810;
            --muted: #7C5C50;
            --border: #E8D5C4;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            background-color: var(--cream);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* ─────────────────────────── BACKGROUND DECORATIONS ─────────────────────────── */
        .bg-decoration {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        .glow-top-right {
            top: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .glow-bottom-left {
            bottom: -15%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        .blood-drop-large {
            position: fixed;
            top: 5%;
            right: 8%;
            width: 180px;
            height: 200px;
            background: rgba(185, 28, 28, 0.04);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            pointer-events: none;
            z-index: 0;
        }

        .blood-drop-small {
            position: fixed;
            bottom: 10%;
            left: 5%;
            width: 120px;
            height: 140px;
            background: rgba(185, 28, 28, 0.03);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            pointer-events: none;
            z-index: 0;
        }

        /* ─────────────────────────── LOGO SECTION ─────────────────────────── */
        .logo-section {
            display: none;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 32px;
            transition: opacity 0.3s ease;
        }

        .logo:hover {
            opacity: 0.8;
        }

        .blood-drop-icon {
            width: 40px;
            height: 50px;
            background-color: var(--red);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--red);
        }

        /* ─────────────────────────── LOGIN CARD ─────────────────────────── */
        .login-card {
            background-color: var(--white);
            border-radius: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            max-width: 900px;
            animation: fadeUp 0.6s ease-out 0.05s both;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .login-card-left {
            padding: 56px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .login-card-right {
            padding: 56px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Card Header */
        .card-header {
            text-align: center;
            margin-bottom: 0;
        }

        .welcome-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--red-light);
            color: var(--red);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--red);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        .card-heading {
            font-family: 'Playfair Display', serif;
            font-size: 40px;
            font-weight: 900;
            line-height: 1.2;
            color: var(--text);
            margin-bottom: 12px;
        }

        .card-heading .italic {
            font-style: italic;
            color: var(--red);
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .card-divider {
            width: 48px;
            height: 4px;
            background-color: var(--red);
            border-radius: 2px;
            margin: 0 auto;
        }

        /* Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            position: relative;
            animation: fadeUp 0.6s ease-out forwards;
        }

        .form-group:nth-child(1) {
            animation-delay: 0.1s;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.18s;
        }

        .form-group-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group-label a {
            color: var(--red);
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            transition: color 0.3s ease;
        }

        .form-group-label a:hover {
            color: var(--red-dark);
        }

        .form-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input-icon {
            position: absolute;
            left: 16px;
            color: var(--red);
            font-size: 16px;
            pointer-events: none;
            z-index: 1;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--text);
            background-color: var(--cream);
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: var(--muted);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.1);
            background-color: var(--white);
        }

        .form-password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--red);
            font-size: 16px;
            transition: color 0.3s ease;
            z-index: 2;
        }

        .form-password-toggle:hover {
            color: var(--red-dark);
        }

        .form-submit {
            width: 100%;
            padding: 16px 24px;
            background-color: var(--red);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            margin-top: 4px;
            animation: fadeUp 0.6s ease-out 0.32s both;
        }

        .form-submit:hover {
            background-color: var(--red-dark);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(185, 28, 28, 0.4);
        }

        /* Divider */
        .form-divider {
            margin: 24px 0;
            position: relative;
            text-align: center;
            animation: fadeUp 0.6s ease-out 0.35s both;
        }

        .form-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--border);
        }

        .form-divider-text {
            position: relative;
            background-color: var(--white);
            padding: 0 12px;
            font-size: 13px;
            color: var(--muted);
        }

        .form-signup-link {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            animation: fadeUp 0.6s ease-out 0.4s both;
        }

        .form-signup-link a {
            color: var(--red);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .form-signup-link a:hover {
            color: var(--red-dark);
        }

        /* ─────────────────────────── PAGE FOOTER ─────────────────────────── */
        .page-footer {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-top: 48px;
            animation: fadeUp 0.6s ease-out 0.45s both;
            position: relative;
            z-index: 1;
        }

        .page-footer a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .page-footer a:hover {
            color: var(--red);
        }

        /* ─────────────────────────── ANIMATIONS ─────────────────────────── */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .login-card {
                grid-template-columns: 1fr;
                max-width: 440px;
            }

            .login-card-left {
                padding: 40px 32px;
            }

            .login-card-right {
                padding: 40px 32px;
            }

            html, body {
                padding: 24px 16px;
            }

            .logo-section {
                display: none;
            }

            .card-heading {
                font-size: 28px;
            }

            .card-subtitle {
                font-size: 13px;
            }

            .page-footer {
                margin-top: 32px;
            }

            .blood-drop-large {
                width: 120px;
                height: 140px;
                top: 2%;
                right: 2%;
            }

            .blood-drop-small {
                width: 80px;
                height: 100px;
                bottom: 5%;
                left: 2%;
            }
        }
    </style>
</head>
<body>
    <!-- Background Decorations -->
    <div class="bg-decoration glow-top-right"></div>
    <div class="bg-decoration glow-bottom-left"></div>
    <div class="bg-decoration blood-drop-large"></div>
    <div class="bg-decoration blood-drop-small"></div>

    <!-- Logo Section -->
    <div class="logo-section">
        <a href="index.html" class="logo">
            <div class="blood-drop-icon">
                <i class="bi bi-droplet-fill"></i>
            </div>
            <span class="logo-text">BloodChain</span>
        </a>
    </div>

    <!-- Login Card -->
    <div class="login-card">
        <!-- Left Column: Header -->
        <div class="login-card-left">
            <a href="index.html" class="logo">
                <div class="blood-drop-icon">
                    <i class="bi bi-droplet-fill"></i>
                </div>
                <span class="logo-text">BloodChain</span>
            </a>
            <div class="card-header">
                <div class="welcome-badge">
                    <span class="pulse-dot"></span>
                    Welcome back
                </div>
                <h1 class="card-heading">
                    Good to see<br>
                    <span class="italic">you again.</span>
                </h1>
                <p class="card-subtitle">
                    Sign in to access your BloodChain account.
                </p>
                <div class="card-divider"></div>
            </div>
        </div>

        <!-- Right Column: Form -->
        <div class="login-card-right">
            <!-- Login Form -->
            <form class="login-form" id="loginForm">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-group-label">Email Address</label>
                    <div class="form-input-wrapper">
                        <i class="form-input-icon bi bi-envelope"></i>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="your@email.com" 
                            required
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-group-label">
                        <span>Password</span>
                        <a href="#">Forgot password?</a>
                    </label>
                    <div class="form-input-wrapper">
                        <i class="form-input-icon bi bi-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="••••••••" 
                            required
                        >
                        <button 
                            type="button" 
                            class="form-password-toggle" 
                            onclick="togglePassword()"
                        >
                            <i class="bi bi-eye-fill" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="form-submit">
                    <span>Sign In</span>
                    <i class="bi bi-arrow-right"></i>
                </button>

                <!-- Divider -->
                <div class="form-divider">
                    <span class="form-divider-text">Don't have an account yet?</span>
                </div>

                <!-- Sign Up Link -->
                <div class="form-signup-link">
                    <a href="register.html">Create your account →</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Page Footer -->
    <div class="page-footer">
        <a href="index.html">← Back to home</a> · © 2025 BloodChain
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleIcon.classList.remove('bi-eye-fill');
                toggleIcon.classList.add('bi-eye-slash-fill');
            } else {
                passwordField.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash-fill');
                toggleIcon.classList.add('bi-eye-fill');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                alert('Sign in submitted successfully!');
                // In a real app, this would send credentials to the backend
            }
        });
    </script>
</body>
</html>
