global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'bloodchain-donor'
    metrics_path: /metrics
    static_configs:
      - targets: ['donor-service:8000']
        labels:
          service: 'donor'
          team: 'bloodchain'

  - job_name: 'bloodchain-hospital'
    metrics_path: /metrics
    static_configs:
      - targets: ['hospital-service:8000']
        labels:
          service: 'hospital'
          team: 'bloodchain'

  - job_name: 'bloodchain-blood-tracking'
    metrics_path: /metrics
    static_configs:
      - targets: ['blood-tracking-service:8000']
        labels:
          service: 'blood-tracking'
          team: 'bloodchain'

  - job_name: 'bloodchain-notifications'
    metrics_path: /metrics
    static_configs:
      - targets: ['notifications-service:8000']
        labels:
          service: 'notifications'
          team: 'bloodchain'

  - job_name: 'bloodchain-user-management'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-management:8000']
        labels:
          service: 'user-management'
          team: 'bloodchain'

  - job_name: 'bloodchain-data-warehouse'
    metrics_path: /metrics
    static_configs:
      - targets: ['data-warehouse:8000']
        labels:
          service: 'data-warehouse'
          team: 'bloodchain'

  - job_name: 'bloodchain-location'
    metrics_path: /metrics
    static_configs:
      - targets: ['location-service:8000']
        labels:
          service: 'location'
          team: 'bloodchain'

  - job_name: 'bloodchain-rewards'
    metrics_path: /metrics
    static_configs:
      - targets: ['rewards-service:8000']
        labels:
          service: 'rewards'
          team: 'bloodchain'

  - job_name: 'bloodchain-prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          team: 'bloodchain'
