apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-warehouse
  namespace: bloodchain
  labels:
    app: data-warehouse
    component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-warehouse
      component: service
  template:
    metadata:
      labels:
        app: data-warehouse
        component: service
    spec:
      containers:
        - name: data-warehouse
          image: finamou/bloodchain-data-warehouse:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: bloodchain-secrets
          env:
            - name: CLICKHOUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: bloodchain-secrets
                  key: CLICKHOUSE_HOST
            - name: CLICKHOUSE_PORT
              valueFrom:
                secretKeyRef:
                  name: bloodchain-secrets
                  key: CLICKHOUSE_PORT
            - name: CLICKHOUSE_DB
              valueFrom:
                secretKeyRef:
                  name: bloodchain-secrets
                  key: CLICKHOUSE_DB
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-warehouse
  namespace: bloodchain
  labels:
    app: data-warehouse
    component: service
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: data-warehouse
    component: service
