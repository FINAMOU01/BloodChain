apiVersion: apps/v1
kind: Deployment
metadata:
  name: rewards-service
  namespace: bloodchain
  labels:
    app: rewards-service
    component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rewards-service
      component: service
  template:
    metadata:
      labels:
        app: rewards-service
        component: service
    spec:
      containers:
        - name: rewards-service
          image: finamou/bloodchain-rewards-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: bloodchain-secrets
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: bloodchain-secrets
                  key: MONGODB_URI
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rewards-service
  namespace: bloodchain
  labels:
    app: rewards-service
    component: service
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: rewards-service
    component: service
