apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-service
  namespace: bloodchain
  labels:
    app: hospital-service
    component: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospital-service
      component: service
  template:
    metadata:
      labels:
        app: hospital-service
        component: service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics/"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: hospital-service
          image: finamou/bloodchain-hospital-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: bloodchain-secrets

          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-service
  namespace: bloodchain
  labels:
    app: hospital-service
    component: service
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: hospital-service
    component: service
