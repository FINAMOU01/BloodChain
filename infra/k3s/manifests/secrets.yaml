apiVersion: v1
kind: Secret
metadata:
  name: bloodchain-secrets
  namespace: bloodchain
type: Opaque
stringData:
  # Database credentials
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: bloodchain
  DB_USER: postgres
  DB_PASSWORD: postgres
  SECRET_KEY: bloodchain-django-secret-key-2026
  DEBUG: "False"
  REDIS_URL: redis://redis:6379/1
  ALLOWED_HOSTS: "*"

  # MongoDB (rewards-service)
  MONGODB_URI: mongodb://admin:admin@mongodb:27017/bloodchain_rewards?authSource=admin
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: admin

  # ClickHouse (data-warehouse)
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_DB: bloodchain_warehouse

  # Blockchain gateway
  WEB3_PROVIDER_URI: https://sepolia.infura.io/v3/YOUR-PROJECT-ID
  PRIVATE_KEY: your_key

  # PostgreSQL superuser (for init)
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: bloodchain
